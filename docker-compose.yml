services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: datachat
      POSTGRES_PASSWORD: datachat
      POSTGRES_DB: datachat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datachat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://datachat:datachat@db:5432/datachat
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Development only: a sample MySQL customer database for tests.
  # Start with: docker compose --profile dev up -d mysql
  mysql:
    profiles: ["dev"]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  mysqldata:
