[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datachat-agent"
version = "0.1.0.dev0"
description = "Open-source AI agent that answers questions from your SQL database and PDFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "cryptography>=43",
    "typer>=0.12",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "alembic>=1.13",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
datachat-agent = "datachat_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["packages/datachat_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
markers = ["integration: needs the Docker Postgres (and MySQL for mysql tests)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["datachat_agent"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "datachat_agent.server.auth.require_scope"]
