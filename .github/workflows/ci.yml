name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: datachat
          POSTGRES_PASSWORD: datachat
          POSTGRES_DB: datachat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datachat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit + integration against Postgres and MySQL)
        run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-host image
        run: docker build -t datachat-agent:ci .
      - name: CLI starts inside the image
        run: docker run --rm datachat-agent:ci datachat-agent --help

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDK (sdk-js)
        working-directory: sdk-js
        run: |
          npm ci
          npm test
      - name: Widget (widget)
        working-directory: widget
        run: |
          npm ci
          npx tsc -p tsconfig.json
          npm test
          npm run build
      - name: The widget served by the API is the freshly built one
        run: cmp widget/dist/widget.js packages/datachat_agent/server/static/widget.js
      - name: Admin console (console)
        working-directory: console
        run: |
          npm ci
          npx tsc -p tsconfig.json
          npm test
          npm run build
      - name: The console served by the API is the freshly built one
        run: diff -r console/dist packages/datachat_agent/server/static/console

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*
      - name: Wheel installs and starts
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/datachat-agent --help
          /tmp/v/bin/python -c "import datachat_agent, importlib.resources as r; assert r.files('datachat_agent').joinpath('server/static/widget.js').is_file()"
