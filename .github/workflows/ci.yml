name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: datachat
          POSTGRES_PASSWORD: datachat
          POSTGRES_DB: datachat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datachat"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (unit + integration against Postgres and MySQL)
        run: pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-host image
        run: docker build -t datachat-agent:ci .
      - name: CLI starts inside the image
        run: docker run --rm datachat-agent:ci datachat-agent --help
